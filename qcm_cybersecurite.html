<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Cybersécurité</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&display=swap');

  :root {
    --bg: #070d14;
    --bg2: #0d1b2a;
    --card: #111c2d;
    --border: #1a2e45;
    --cyan: #00d4ff;
    --cyan-dim: rgba(0,212,255,0.12);
    --green: #00c896;
    --red: #ff4757;
    --orange: #ff8c00;
    --purple: #7b2fbe;
    --text: #e8f4fd;
    --muted: #5a7a9a;
    --gold: #ffd700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* — GRID BG — */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* — SCAN LINE — */
  body::after {
    content: '';
    position: fixed;
    top: -100%;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    animation: scan 8s linear infinite;
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
  }

  @keyframes scan {
    0% { top: -2px; }
    100% { top: 100%; }
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 820px;
    margin: 0 auto;
    padding: 20px;
  }

  /* — HEADER — */
  .header {
    text-align: center;
    padding: 40px 0 30px;
  }

  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--cyan-dim);
    border: 1px solid var(--cyan);
    border-radius: 20px;
    padding: 6px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 2px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .header-badge::before {
    content: '●';
    animation: blink 1.2s infinite;
    color: var(--green);
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  h1 {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    background: linear-gradient(135deg, var(--cyan) 0%, #ffffff 50%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* — PROGRESS BAR — */
  .progress-wrap {
    margin: 24px 0;
    position: relative;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
  }

  .progress-q { color: var(--cyan); }
  .progress-score { color: var(--gold); }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: -3px;
    width: 10px;
    height: 10px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--cyan);
  }

  /* — CATEGORY TAG — */
  .category-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 14px;
    border: 1px solid currentColor;
    opacity: 0.8;
  }

  /* — QUESTION CARD — */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(.4,0,.2,1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent-color, var(--cyan));
    opacity: 0.6;
  }

  .q-number {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 22px;
  }

  /* — OPTIONS — */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    position: relative;
    overflow: hidden;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
  }

  .option:hover:not(:disabled) {
    border-color: var(--cyan);
    background: var(--cyan-dim);
    transform: translateX(4px);
  }

  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    transition: all 0.2s;
  }

  .option:hover:not(:disabled) .option-letter {
    border-color: var(--cyan);
    color: var(--cyan);
  }

  .option.selected {
    border-color: var(--cyan);
    background: rgba(0,212,255,0.08);
  }

  .option.selected .option-letter {
    background: var(--cyan);
    border-color: var(--cyan);
    color: var(--bg);
    font-weight: bold;
  }

  .option.correct {
    border-color: var(--green);
    background: rgba(0,200,150,0.12);
    animation: correctPulse 0.4s ease;
  }

  .option.correct .option-letter {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg);
  }

  .option.wrong {
    border-color: var(--red);
    background: rgba(255,71,87,0.1);
    animation: shake 0.4s ease;
  }

  .option.wrong .option-letter {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }

  .option.show-correct {
    border-color: var(--green);
    background: rgba(0,200,150,0.07);
  }

  .option.show-correct .option-letter {
    border-color: var(--green);
    color: var(--green);
  }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.01); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* — EXPLANATION — */
  .explanation {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explanation.correct-exp {
    background: rgba(0,200,150,0.1);
    border: 1px solid rgba(0,200,150,0.3);
    color: #7fffd4;
  }

  .explanation.wrong-exp {
    background: rgba(255,71,87,0.08);
    border: 1px solid rgba(255,71,87,0.25);
    color: #ffb3bb;
  }

  .explanation.show { display: block; }

  /* — NAV BUTTONS — */
  .nav-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
    gap: 12px;
  }

  .btn {
    padding: 12px 28px;
    border-radius: 8px;
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-next {
    background: linear-gradient(135deg, var(--cyan), #0099cc);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(0,212,255,0.25);
  }

  .btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0,212,255,0.45);
  }

  .btn-next:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* — RESULTS SCREEN — */
  .results {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: slideIn 0.5s ease;
  }

  .results.show { display: block; }

  .score-ring {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 30px;
  }

  .score-ring svg {
    transform: rotate(-90deg);
  }

  .score-ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-big {
    font-size: 42px;
    font-weight: 900;
    font-family: 'Share Tech Mono', monospace;
  }

  .score-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .result-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 10px;
  }

  .result-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .stat-val {
    font-size: 28px;
    font-weight: 900;
    font-family: 'Share Tech Mono', monospace;
  }

  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* — CATEGORY BREAKDOWN — */
  .breakdown {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
    text-align: left;
  }

  .breakdown h3 {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-family: 'Share Tech Mono', monospace;
  }

  .cat-row {
    margin-bottom: 10px;
  }

  .cat-row-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
  }

  .cat-name { color: var(--text); }
  .cat-score { color: var(--muted); font-family: 'Share Tech Mono', monospace; }

  .cat-bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .cat-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }

  .btn-retry {
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    padding: 14px 40px;
    font-size: 14px;
    letter-spacing: 2px;
  }

  .btn-retry:hover {
    background: var(--cyan-dim);
    transform: translateY(-2px);
  }

  /* — START SCREEN — */
  .start-screen {
    text-align: center;
    padding: 40px 20px;
  }

  .start-info-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
    margin: 30px 0;
  }

  .start-info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 14px;
  }

  .start-info-icon {
    font-size: 28px;
    margin-bottom: 8px;
  }

  .start-info-val {
    font-size: 24px;
    font-weight: 900;
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
  }

  .start-info-lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .topics-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 20px 0 32px;
  }

  .topic-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--muted);
  }

  .btn-start {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: white;
    padding: 16px 52px;
    font-size: 16px;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(0,212,255,0.2);
    border-radius: 10px;
  }

  .btn-start:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 50px rgba(0,212,255,0.4);
  }

  /* — QUESTION SCREEN — */
  .quiz-screen { display: none; }
  .quiz-screen.show { display: block; }

  /* Responsive */
  @media (max-width: 520px) {
    .stats-grid, .start-info-grid { grid-template-columns: repeat(2,1fr); }
    .q-text { font-size: 15px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-badge">QCM INTERACTIF</div>
    <h1>CYBERSÉCURITÉ</h1>
    <p class="subtitle">Testez vos connaissances en 30 questions</p>
  </div>

  <!-- START SCREEN -->
  <div class="start-screen" id="startScreen">
    <div class="start-info-grid">
      <div class="start-info-card">
        <div class="start-info-icon">❓</div>
        <div class="start-info-val">30</div>
        <div class="start-info-lbl">Questions</div>
      </div>
      <div class="start-info-card">
        <div class="start-info-icon">🏆</div>
        <div class="start-info-val">60</div>
        <div class="start-info-lbl">Points max</div>
      </div>
      <div class="start-info-card">
        <div class="start-info-icon">📚</div>
        <div class="start-info-val">6</div>
        <div class="start-info-lbl">Thèmes</div>
      </div>
    </div>
    <div class="topics-list">
      <span class="topic-pill" style="border-color:#00d4ff;color:#00d4ff">Définitions</span>
      <span class="topic-pill" style="border-color:#7b2fbe;color:#a06cd5">Types de menaces</span>
      <span class="topic-pill" style="border-color:#00c896;color:#00c896">Bonnes pratiques</span>
      <span class="topic-pill" style="border-color:#ffd700;color:#ffd700">Mots de passe</span>
      <span class="topic-pill" style="border-color:#ff8c00;color:#ff8c00">Arnaques & Phishing</span>
      <span class="topic-pill" style="border-color:#ff4757;color:#ff4757">Réaction & Outils</span>
    </div>
    <button class="btn btn-start" onclick="startQuiz()">▶ COMMENCER</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="quiz-screen" id="quizScreen">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="progress-q" id="progressLabel">QUESTION 1 / 30</span>
        <span class="progress-score" id="scoreLabel">SCORE : 0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div id="questionArea"></div>

    <div class="nav-area">
      <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()" disabled>SUIVANT →</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div class="results" id="resultsScreen">
    <div class="score-ring">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#1a2e45" stroke-width="10"/>
        <circle cx="80" cy="80" r="70" fill="none" stroke-width="10" stroke-linecap="round"
          id="scoreCircle" stroke-dasharray="439.82" stroke-dashoffset="439.82"
          style="transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)"/>
      </svg>
      <div class="score-ring-text">
        <span class="score-big" id="scoreBig">0</span>
        <span class="score-label">/ 60 pts</span>
      </div>
    </div>

    <div class="result-title" id="resultTitle">—</div>
    <div class="result-sub" id="resultSub">—</div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="statCorrect" style="color:var(--green)">0</div>
        <div class="stat-lbl">✓ Bonnes</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statWrong" style="color:var(--red)">0</div>
        <div class="stat-lbl">✗ Mauvaises</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statPct" style="color:var(--cyan)">0%</div>
        <div class="stat-lbl">Taux réussite</div>
      </div>
    </div>

    <div class="breakdown" id="breakdownArea"></div>

    <button class="btn btn-retry" onclick="restartQuiz()">↺ RECOMMENCER</button>
  </div>

</div>

<script>
const QUESTIONS = [
  // ── DÉFINITIONS (5) ─────────────────────────────────────────────────────
  {
    cat: "Définitions", catColor: "#00d4ff",
    q: "Que désigne le terme « cybersécurité » ?",
    opts: [
      "La protection des câbles informatiques contre les dommages physiques",
      "L'ensemble des pratiques, technologies et processus visant à protéger systèmes, réseaux et données contre les attaques",
      "Un logiciel antivirus installé sur un ordinateur",
      "La sécurisation uniquement des connexions Wi-Fi domestiques"
    ],
    correct: 1,
    exp: "La cybersécurité couvre l'ensemble des moyens (humains, techniques, organisationnels) destinés à protéger systèmes, réseaux et données contre tout accès non autorisé, dommage ou attaque."
  },
  {
    cat: "Définitions", catColor: "#00d4ff",
    q: "Le principe de « confidentialité » en cybersécurité signifie que :",
    opts: [
      "Vos fichiers restent disponibles même en cas de panne",
      "Vos données ne sont ni modifiées ni altérées par un tiers",
      "Vos données restent privées et accessibles uniquement par les personnes autorisées",
      "Votre connexion Internet est chiffrée en permanence"
    ],
    correct: 2,
    exp: "La confidentialité garantit que l'information n'est accessible qu'aux personnes, entités ou processus autorisés — c'est le « C » du triptyque CIA (Confidentiality, Integrity, Availability)."
  },
  {
    cat: "Définitions", catColor: "#00d4ff",
    q: "Quel sigle résume les trois piliers fondamentaux de la cybersécurité ?",
    opts: ["CAN", "CIA", "CPE", "RGP"],
    correct: 1,
    exp: "Le modèle CIA (Confidentialité, Intégrité, Disponibilité / en anglais : Confidentiality, Integrity, Availability) est la base de toute politique de sécurité informatique."
  },
  {
    cat: "Définitions", catColor: "#00d4ff",
    q: "D'après les statistiques mondiales, à quelle fréquence a lieu une cyberattaque ?",
    opts: ["Toutes les 39 secondes", "Toutes les 5 minutes", "Toutes les heures", "Une fois par jour"],
    correct: 0,
    exp: "Une cyberattaque se produit en moyenne toutes les 39 secondes dans le monde, soit plus de 2 000 attaques par jour, ciblant aussi bien les particuliers que les entreprises."
  },
  {
    cat: "Définitions", catColor: "#00d4ff",
    q: "Quel pourcentage des cyberattaques commence par un email frauduleux ?",
    opts: ["30 %", "60 %", "90 %", "100 %"],
    correct: 2,
    exp: "Environ 90 % des cyberattaques débutent par un email frauduleux (phishing). C'est la raison pour laquelle la vigilance sur les emails reste la première ligne de défense."
  },

  // ── TYPES DE MENACES (6) ────────────────────────────────────────────────
  {
    cat: "Types de menaces", catColor: "#a06cd5",
    q: "Un ransomware est un logiciel malveillant qui :",
    opts: [
      "Surveille votre activité et enregistre vos frappes clavier",
      "Chiffre vos fichiers et exige une rançon pour les déverrouiller",
      "Bombarde votre navigateur de publicités intrusives",
      "Bloque temporairement votre accès à Internet"
    ],
    correct: 1,
    exp: "Le ransomware (ou rançongiciel) chiffre les fichiers de la victime et exige le paiement d'une rançon (souvent en cryptomonnaie) pour fournir la clé de déchiffrement. Ne payez jamais : restaurez depuis une sauvegarde."
  },
  {
    cat: "Types de menaces", catColor: "#a06cd5",
    q: "Un spyware est principalement utilisé pour :",
    opts: [
      "Chiffrer les données de l'utilisateur",
      "Envoyer des spams depuis votre machine",
      "Espionner votre activité et voler vos mots de passe",
      "Ralentir votre connexion Internet"

// ── STATE ───────────────────────────────────────────────────────────────────
let current = 0;
let score = 0;
let answered = 0;
let results = []; // {correct: bool, cat: str}
let answered_this = false;

function startQuiz() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').classList.add('show');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  answered_this = false;
  document.getElementById('nextBtn').disabled = true;

  // Progress
  document.getElementById('progressLabel').textContent = `QUESTION ${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('scoreLabel').textContent = `SCORE : ${score} / ${answered * 2}`;
  document.getElementById('progressFill').style.width = `${(current / QUESTIONS.length) * 100}%`;

  const letters = ['A', 'B', 'C', 'D'];
  const html = `
    <div class="q-card" style="--accent-color: ${q.catColor}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span class="category-tag" style="color:${q.catColor};border-color:${q.catColor}">${q.cat}</span>
      </div>
      <div class="q-number">QUESTION ${current + 1} SUR ${QUESTIONS.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.opts.map((o, i) => `
          <button class="option" id="opt${i}" onclick="selectAnswer(${i})">
            <span class="option-letter">${letters[i]}</span>
            <span>${o}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp"></div>
    </div>
  `;
  document.getElementById('questionArea').innerHTML = html;
}

function selectAnswer(idx) {
  if (answered_this) return;
  answered_this = true;
  answered++;

  const q = QUESTIONS[current];
  const isCorrect = idx === q.correct;

  if (isCorrect) score += 2;
  results.push({ correct: isCorrect, cat: q.cat });

  // Style options
  for (let i = 0; i < q.opts.length; i++) {
    const el = document.getElementById(`opt${i}`);
    el.disabled = true;
    if (i === idx && isCorrect) el.classList.add('correct');
    else if (i === idx && !isCorrect) el.classList.add('wrong');
    else if (i === q.correct) el.classList.add('show-correct');
  }

  // Explanation
  const exp = document.getElementById('exp');
  exp.textContent = (isCorrect ? '✓ Correct ! ' : '✗ Incorrect. ') + q.exp;
  exp.className = `explanation show ${isCorrect ? 'correct-exp' : 'wrong-exp'}`;

  // Update score display
  document.getElementById('scoreLabel').textContent = `SCORE : ${score} / ${answered * 2}`;

  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').textContent = current === QUESTIONS.length - 1 ? 'RÉSULTATS →' : 'SUIVANT →';
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById('quizScreen').classList.remove('show');
  const res = document.getElementById('resultsScreen');
  res.classList.add('show');

  const total = QUESTIONS.length * 2;
  const pct = Math.round((score / total) * 100);
  const correct = results.filter(r => r.correct).length;
  const wrong = results.length - correct;

  // Score ring
  const circumference = 439.82;
  const offset = circumference - (circumference * pct / 100);
  const circle = document.getElementById('scoreCircle');
  const ringColor = pct >= 80 ? '#00c896' : pct >= 60 ? '#ffd700' : pct >= 40 ? '#ff8c00' : '#ff4757';
  circle.style.stroke = ringColor;
  setTimeout(() => { circle.style.strokeDashoffset = offset; }, 100);

  document.getElementById('scoreBig').textContent = score;
  document.getElementById('scoreBig').style.color = ringColor;

  // Titles
  const [title, sub] = pct >= 90 ? ['🏆 Expert Cyber !', 'Vous maîtrisez parfaitement la cybersécurité.']
    : pct >= 75 ? ['🛡️ Très bien !', 'Vous avez de solides bases en cybersécurité.']
    : pct >= 55 ? ['👍 Bien !', 'Vous avez les fondamentaux. Quelques points à revoir.']
    : pct >= 35 ? ['⚡ En progrès', 'Revoyez la présentation pour renforcer vos bases.']
    : ['📚 À revoir', 'La présentation vous aidera à bien démarrer.'];

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statPct').textContent = pct + '%';

  // Category breakdown
  const cats = {};
  QUESTIONS.forEach((q, i) => {
    if (!cats[q.cat]) cats[q.cat] = { total: 0, correct: 0, color: q.catColor };
    cats[q.cat].total++;
    if (results[i] && results[i].correct) cats[q.cat].correct++;
  });

  let bdHtml = '<h3>Résultats par thème</h3>';
  for (const [cat, data] of Object.entries(cats)) {
    const p = Math.round((data.correct / data.total) * 100);
    bdHtml += `
      <div class="cat-row">
        <div class="cat-row-header">
          <span class="cat-name">${cat}</span>
          <span class="cat-score">${data.correct}/${data.total} · ${p}%</span>
        </div>
        <div class="cat-bar-bg">
          <div class="cat-bar-fill" style="width:${p}%;background:${data.color}"></div>
        </div>
      </div>`;
  }
  document.getElementById('breakdownArea').innerHTML = bdHtml;
}

function restartQuiz() {
  current = 0; score = 0; answered = 0; results = []; answered_this = false;
  document.getElementById('resultsScreen').classList.remove('show');
  document.getElementById('progressFill').style.width = '0%';
  const circle = document.getElementById('scoreCircle');
  circle.style.strokeDashoffset = 439.82;
  document.getElementById('quizScreen').classList.add('show');
  renderQuestion();
}
